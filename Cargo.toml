[package]
name         = "rscap"
version      = "0.1.0"
edition      = "2021"
rust-version = "1.82"
description  = "Enregistreur d'ecran temps reel: pipeline multithread capture -> encodage materiel -> muxage MP4"
license      = "MIT OR Apache-2.0"

[[bin]]
name = "rscap"
path = "src/main.rs"

[lib]
name = "rscap"
path = "src/lib.rs"

# L'interface graphique est un second binaire, pas une option du premier :
# `rscap` reste utilisable sur une machine sans GTK, et une compilation
# sans `--features gui` ne telecharge meme pas les liaisons.
[[bin]]
name              = "rscap-gui"
path              = "src/bin/rscap-gui.rs"
required-features = ["gui"]

[features]
default = []
gui     = ["dep:gtk4", "dep:libadwaita"]

[dependencies]
ffmpeg-next       = { version = "9.0", default-features = false, features = ["codec", "format", "software-scaling", "software-resampling", "filter"] }
crossbeam-channel = "0.5"
crossbeam-queue   = "0.3"
parking_lot       = "0.12"
thiserror         = "2.0"
tracing           = { version = "0.1", features = ["release_max_level_debug"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "time"] }
tracing-appender  = "0.2"
clap              = { version = "4", features = ["derive"] }
serde             = { version = "1", features = ["derive"] }
toml              = "1"
libc              = "0.2"
ctrlc             = "3"
hdrhistogram      = { version = "7", default-features = false }

# Interface graphique, optionnelle (feature "gui").
# `v4_10` donne `gtk::FileDialog` et `v1_5` donne `adw::AlertDialog` : les
# anciennes API de dialogue sont depreciees et se comportent mal sous Wayland.
# Elles fixent le minimum requis a GTK 4.10 et libadwaita 1.5.
gtk4              = { version = "0.11", optional = true, features = ["v4_10"] }
libadwaita        = { version = "0.9", optional = true, features = ["v1_5"] }

[target.'cfg(target_os = "linux")'.dependencies]
pipewire                = "0.10"
libspa                  = "0.10"
libpulse-binding        = "2.30"
libpulse-simple-binding = "2.29"
ashpd                   = { version = "0.13", default-features = false, features = ["tokio", "screencast"] }
tokio                   = { version = "1", features = ["rt", "time", "macros"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
panic         = "unwind"
debug         = 1

[profile.bench]
inherits = "release"
